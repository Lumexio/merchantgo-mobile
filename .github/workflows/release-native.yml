name: Build & Publish Native Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.0.8)'
        required: true

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Install & Build Web Bundle
        run: |
          npm ci
          TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          npm pkg set version="${TAG#v}"
          npm run build
        env:
          VITE_API_BASE_URL: https://api.merchantgo.store
          
      - name: Capacitor Android Build
        run: |
          npx cap sync android
          # Inject versionCode and versionName into build.gradle for Android OS upgrade detection
          TAG=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          VERSION="${TAG#v}"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../MerchantGo-${TAG}-android.apk"
          
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: MerchantGo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: MerchantGo-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

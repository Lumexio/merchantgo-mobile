name: Build & Publish Native Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: Install & Build Web Bundle
        run: |
          npm ci
          if [[ "$GITHUB_REF_NAME" == v* ]]; then npm pkg set version="${GITHUB_REF_NAME#v}"; fi
          npm run build
        env:
          VITE_API_BASE_URL: https://api.merchantgo.store
          
      - name: Capacitor Android Build
        run: |
          npx cap sync android
          # Inject versionCode and versionName into build.gradle for Android OS upgrade detection
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
            sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          fi
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../MerchantGo-${GITHUB_REF_NAME}-android.apk"
          
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: MerchantGo ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          generate_release_notes: true
          files: MerchantGo-${{ github.ref_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
